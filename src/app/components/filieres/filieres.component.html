<div class="container mt-4">
  <h2 class="mb-4">Gestion des Filieres</h2>
  
    <!-- Formulaire d'ajout -->
    <div class="card p-3 mb-4">
      <h5>Ajouter une nouvelle filiere</h5>
      <form (ngSubmit)="ajouterFiliere()">
        <div class="form-group mb-2">
          <label>Code de la filiere :</label>
          <input type="text" class="form-control" [(ngModel)]="nouvelleFiliere.Codefil" name="Codefil" required>
        </div>

        <div class="form-group mb-2">
          <label>Libellé de la filiere :</label>
          <input type="text" class="form-control" [(ngModel)]="nouvelleFiliere.Libelle" name="Libelle" required>
        </div>

        <button type="submit" class="btn btn-primary">Ajouter</button>
      </form>
    </div>
    
  
    <!-- Tableau d'affichage -->
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Code</th>
          <th>Libellé</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let filiere of filieres; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ filiere.Codefil }}</td>
          <td>{{ filiere.Libelle }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="modifierFiliere(filiere)">Modifier</button>
            <button class="btn btn-danger btn-sm" (click)="supprimerFiliere(filiere.id!)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <!-- Modal de modification -->
    <div *ngIf="filiereSelectionnee" class="modal d-block" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content p-3">
          <h5 class="modal-title">Modifier la filière</h5>
          <form (ngSubmit)="enregistrerModification()" #formModif="ngForm">
            <div class="mb-3">
              <label>Code filière</label>
              <input type="text" class="form-control" name="Codefil"
                     [(ngModel)]="filiereSelectionnee.Codefil" required>
            </div>
            <div class="mb-3">
              <label>Libellé</label>
              <input type="text" class="form-control" name="Libelle"
                     [(ngModel)]="filiereSelectionnee.Libelle" required>
            </div>
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary me-2" [disabled]="formModif.invalid">Enregistrer</button>
              <button type="button" class="btn btn-secondary" (click)="filiereSelectionnee = null">Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
