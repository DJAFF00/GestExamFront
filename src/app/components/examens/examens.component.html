<div class="container mt-4">
    <h2 class="mb-4">Gestion des Examens</h2>
  
    <!-- Formulaire d'ajout -->
    <div class="card p-3 mb-4">
      <h5>Ajouter un nouvel examen</h5>
      <form (ngSubmit)="ajouterExamen()">
        <div class="form-group mb-2">
          <label>Code de l'examen :</label>
          <input type="text" class="form-control" [(ngModel)]="nouvelExamen.Codexam" name="Codexam" required />
        </div>
  
        <div class="form-group mb-2">
          <label>Libellé de l'examen :</label>
          <input type="text" class="form-control" [(ngModel)]="nouvelExamen.Libellexam" name="Libellexam" required />
        </div>
  
        <button type="submit" class="btn btn-primary">Ajouter</button>
      </form>
    </div>
  
    <!-- Formulaire de modification -->
    <div *ngIf="examenSelectionne" class="modal d-block" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content p-3">
          <h5  class="modal-title">Modifier l'examen</h5>
          <form (ngSubmit)="enregistrerModification()" #formModif="ngForm">
            <div class="mb-3">
              <label>Code de l'examen :</label>
              <input type="text" class="form-control" [(ngModel)]="examenSelectionne.Codexam" name="CodexamModif" required />
            </div>
      
            <div class="mb-3">
              <label>Libellé de l'examen :</label>
              <input type="text" class="form-control" [(ngModel)]="examenSelectionne.Libellexam" name="LibellexamModif" required />
            </div>
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary me-2" [disabled]="formModif.invalid">Enregistrer</button>
              <button type="button" class="btn btn-secondary" (click)="examenSelectionne = null">Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  
    <!-- Tableau des examens -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Code</th>
            <th>Libellé</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let examen of examens; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ examen.Codexam }}</td>
            <td>{{ examen.Libellexam }}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="modifierExamen(examen)">Modifier</button>
              <button class="btn btn-danger btn-sm" (click)="supprimerExamen(examen.id!)">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
